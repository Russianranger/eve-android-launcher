plugins { id 'com.android.application' }
android {
    namespace 'io.github.russianranger.eve'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.russianranger.eve'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '0.1.20'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.includeAndroidResources = true }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libproot.so', '**/libproot-loader.so'] } }
    sourceSets.main.assets.srcDir rootProject.file('backend')
    sourceSets.main.assets.srcDir rootProject.file('docs/licenses')
    if (System.getenv('EVE_PREVIEW_KEYSTORE')) {
        signingConfigs {
            preview {
                storeFile file(System.getenv('EVE_PREVIEW_KEYSTORE'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            // Retain the published preview identity while removing ART debug overhead.
            if (System.getenv('EVE_PREVIEW_KEYSTORE')) signingConfig signingConfigs.preview
        }
        debug {
            if (System.getenv('EVE_PREVIEW_KEYSTORE')) signingConfig signingConfigs.preview
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
