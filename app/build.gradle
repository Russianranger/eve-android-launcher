plugins { id 'com.android.application' }
android {
    namespace 'io.github.russianranger.eve'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.russianranger.eve'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.1.6'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libproot.so', '**/libproot-loader.so'] } }
    sourceSets.main.assets.srcDir rootProject.file('backend')
    sourceSets.main.assets.srcDir rootProject.file('docs/licenses')
    buildTypes { release { minifyEnabled false } }
    if (System.getenv('EVE_PREVIEW_KEYSTORE')) {
        signingConfigs.debug {
            storeFile file(System.getenv('EVE_PREVIEW_KEYSTORE'))
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
}
